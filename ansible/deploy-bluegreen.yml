- name: blue-green deploy
  hosts: prod
  gather_facts: false

  vars:
    upstream_conf: /etc/nginx/conf.d/app_upstream.conf
    colors:
      blue:
        service: web
        port: 8080
        jar: /opt/web/app.jar
      green:
        service: web-green
        port: 8081
        jar: /opt/web-green/app.jar

  tasks:
    - name: read nginx upstream config
      ansible.builtin.slurp:
        src: "{{ upstream_conf }}"
      register: upstream_raw

    - name: determine the active port
      ansible.builtin.set_fact:
        active_port: >-
          {{ (upstream_raw.content | b64decode) | regex_search('server 127\.0\.0\.1:([0-9]+)', '\1') | first }}

    - name: determine active and inactive "color"
      ansible.builtin.set_fact:
        active_color: "{{ 'blue' if active_port == (colors.blue.port | string) else 'green' }}"
        target_color: "{{ 'green' if active_port == (colors.blue.port | string) else 'blue' }}"

    - name: show deploy plan
      ansible.builtin.debug:
        msg: >-
          Active color: {{ active_color }} (port {{ active_port }}).
          Deploying new jar to: {{ target_color }} (port {{ colors[target_color].port }}).

    - name: copy new jar to the inactive instance
      ansible.builtin.copy:
        src: "{{ jar_path }}"
        dest: "{{ colors[target_color].jar }}"

    - name: restart the inactive instance with the new jar
      ansible.builtin.command: "sudo /usr/bin/systemctl restart {{ colors[target_color].service }}"
      changed_when: true

    - name: wait for the new instance to report readiness (bypassing nginx)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ colors[target_color].port }}/actuator/health/readiness"
        status_code: 200
        return_content: true
      register: readiness_check
      until: >-
        readiness_check.status == 200 and
        (readiness_check.json.status | default('')) == 'UP'
      retries: 15
      delay: 2

    - name: point nginx upstream at the new instance
      ansible.builtin.copy:
        dest: "{{ upstream_conf }}"
        content: |
          upstream app_web {
              server 127.0.0.1:{{ colors[target_color].port }};
          }

    - name: validate nginx conf
      ansible.builtin.command: sudo /usr/sbin/nginx -t
      changed_when: false

    - name: reload nginx to switch traffic
      ansible.builtin.command: sudo /usr/bin/systemctl reload nginx
      changed_when: true

    - name: confirm the switch
      ansible.builtin.uri:
        url: "http://127.0.0.1:8090/"
        status_code: 200
      register: final_check
      until: final_check.status == 200
      retries: 5
      delay: 3

    - name: report which "color" is live
      ansible.builtin.debug:
        msg: "Traffic switched to {{ target_color }} (port {{ colors[target_color].port }}). Previous color ({{ active_color }}) left running as a warm standby for rollback."
